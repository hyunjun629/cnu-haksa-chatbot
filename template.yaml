AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
# CloudFormation 문자열(Description 등)은 영문으로 둔다. 한글은 sam deploy 후 ?로 저장됨 (docs/debug-log.md 1, 7번)
Description: >
  CNU Haksa Assistant RAG MVP - S3 docs/web buckets, CloudFront (OAC), API Gateway + Lambda,
  Bedrock Knowledge Bases (S3 Vectors) retrieval, Claude answer generation, DynamoDB logs, least-privilege IAM roles

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9]+"
    Description: Deployment stage name (suffix of resource names)
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Embedding model ID for documents and questions
  GenerationModelName:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Answer generation model ID (invoked through the global.<model ID> cross-Region inference profile)
  ModelExtraFields:
    Type: String
    Default: "{}"
    Description: Extra model request fields as JSON, e.g. {"thinking":{"type":"disabled"}} for Haiku 5.5
  MinScore:
    Type: String
    Default: "0.65"  # scripts/score_check.sh 측정: 관련 질문 최저 0.699, 무관 질문 최고 0.618
    Description: If the top retrieval score is below this value, the model is not called and a no-basis message is returned

Globals:
  Api:
    OpenApiVersion: "3.0.1"
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 512

Resources:
  # ---------- 문서 저장소 (raw/ 원본, processed/ 정제본) ----------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cnu-haksa-docs-${AWS::AccountId}-${Stage}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # ---------- 벡터 검색 저장소 (S3 Vectors) ----------
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub cnu-haksa-vectors-${AWS::AccountId}-${Stage}

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: haksa-docs
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      # 청크 원문과 Bedrock 내부 메타데이터는 필터에 쓰지 않으므로 비필터 키로 지정 (필터용 메타데이터 크기 제한 회피)
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA

  # ---------- Knowledge Bases (분할·임베딩·검색) ----------
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: kb-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeEmbeddingModelOnly
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
              - Sid: ListDocsBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ReadProcessedDocsOnly
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DocsBucket.Arn}/processed/*
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: VectorIndexReadWrite
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt VectorIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub cnu-haksa-kb-${Stage}
      Description: CNU haksa documents (processed/) for RAG retrieval
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt VectorIndex.IndexArn

  DocsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !GetAtt KnowledgeBase.KnowledgeBaseId
      Name: processed-docs
      Description: Cleaned text and .metadata.json under processed/
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocsBucket.Arn
          InclusionPrefixes:
            - processed/
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

  # ---------- 웹 프론트엔드 (S3 비공개 + CloudFront OAC) ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cnu-haksa-web-${AWS::AccountId}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cnu-haksa-web-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub CNU haksa chatbot web (${Stage})
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS 관리형 캐시 정책: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # ---------- 대화·피드백 로그 ----------
  ChatLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cnu-haksa-chatlog-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------- 백엔드 API (API Gateway REST + Lambda) ----------
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cnu-haksa-api-${Stage}
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  ChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cnu-haksa-chat-${Stage}
      RetentionInDays: 90

  ChatFunction:
    Type: AWS::Serverless::Function
    DependsOn: ChatFunctionLogGroup
    Properties:
      FunctionName: !Sub cnu-haksa-chat-${Stage}
      Description: CNU haksa chatbot RAG API (/health, /chat, /feedback)
      CodeUri: backend/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatLogTable
          KB_ID: !GetAtt KnowledgeBase.KnowledgeBaseId
          MODEL_ID: !Sub global.${GenerationModelName}
          MODEL_EXTRA_FIELDS: !Ref ModelExtraFields
          MIN_SCORE: !Ref MinScore
          TOP_K: "5"
          MAX_TOKENS: "800"
          ALLOWED_ORIGIN: !Sub https://${WebDistribution.DomainName}
          LOG_TTL_DAYS: "90"
      # 최소 권한: 로그 테이블 쓰기, 이 Knowledge Base 검색, 지정한 생성 모델 호출만 허용
      Policies:
        - Statement:
            - Sid: WriteChatLogOnly
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ChatLogTable.Arn
            - Sid: RetrieveFromThisKnowledgeBase
              Effect: Allow
              Action: bedrock:Retrieve
              Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
            # 글로벌 교차 리전 추론: 프로필 + 요청 리전의 모델 + 리전 없는 글로벌 모델 ARN이 모두 필요
            - Sid: InvokeGlobalInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${GenerationModelName}
            - Sid: InvokeModelThroughProfileOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${GenerationModelName}
                - !Sub arn:aws:bedrock:::foundation-model/${GenerationModelName}
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${GenerationModelName}
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /health
            Method: get
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat
            Method: post
        Feedback:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /feedback
            Method: post

Outputs:
  WebUrl:
    Description: Web app URL (CloudFront)
    Value: !Sub https://${WebDistribution.DomainName}
  ApiUrl:
    Description: Backend API base URL
    Value: !Sub https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  DocsBucketName:
    Description: Document bucket
    Value: !Ref DocsBucket
  WebBucketName:
    Description: Web static files bucket
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref WebDistribution
  ChatLogTableName:
    Description: Chat and feedback log table
    Value: !Ref ChatLogTable
  ChatFunctionName:
    Description: Chat handler Lambda function
    Value: !Ref ChatFunction
  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !GetAtt KnowledgeBase.KnowledgeBaseId
  DataSourceId:
    Description: Knowledge Base data source ID (processed/)
    Value: !GetAtt DocsDataSource.DataSourceId
  VectorIndexArn:
    Description: S3 Vectors index ARN
    Value: !GetAtt VectorIndex.IndexArn
